[project]
name = "vibe-coding"
version = "0.1.0"
description = "Sistema de gerenciamento de automóveis em Streamlit"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "streamlit",
  "sqlalchemy",
  "pymysql",
  "python-dotenv",
  "pytest",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
